# Generated view of the real MCP tool registry.
# Source of truth: mcp-server.mjs (`tools` + `AGENT_TOOL_NAMES`).
# OpenCode prefixes MCP tool names with the server key: `egl_<name>`.
version: 2
schema_status: synchronized_with_mcp_server
naming:
  mcp: bare_name
  opencode: egl_prefix
  server_key: egl
agent_tools:
  - status
  - read_knowledge
  - inspect
  - job_state
  - generate
  - edit
  - cancel
  - check_alpha
  - photocraft_launch
  - photocraft_new_document
  - photocraft_layers
  - photocraft_place
  - photocraft_canvas
  - photocraft_edit_active
  - photocraft_audit
  - photocraft_save
  - photocraft_export_flat
  - photocraft_export_layers
  - photocraft_command
  - photocraft_commands
  - photocraft_batch
full_tools:
  - status
  - read_knowledge
  - inspect
  - job_state
  - generate
  - edit
  - settings
  - models
  - download_models
  - cancel
  - photocraft_launch
  - photocraft_layers
  - photocraft_place
  - photocraft_canvas
  - photocraft_audit
  - photocraft_new_document
  - photocraft_export_flat
  - photocraft_export_layers
  - check_alpha
  - photocraft_edit_active
  - photocraft_command
  - photocraft_batch
  - photocraft_commands
  - photocraft_export_layer
  - photocraft_export_layers_by_mentions
  - photocraft_project
  - photocraft_save
  - photocraft_open
  - photocraft_recent_projects
hidden_from_agent:
  - settings
  - models
  - download_models
  - photocraft_project
  - photocraft_open
  - photocraft_export_layer
  - photocraft_export_layers_by_mentions
  - photocraft_recent_projects
notes:
  - "The production profile is deny-all + allow egl_*; the full registry exists only when EGGLAB_TOOLSET=full."
  - "Do not select a tool from this file alone; use the live schema and egl_status."
