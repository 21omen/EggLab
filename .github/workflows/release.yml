name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Agent regression gate
        run: npm run test:agent

      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist -- --publish never

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem ..\dist\EggLab-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Warning "Installer is not signed. Windows SmartScreen will warn until a code-signing certificate is configured (see docs/SIGNING.md)."
          }

      - name: Checksums
        run: |
          $exe = Get-ChildItem ..\dist\EggLab-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content ..\dist\SHA256SUMS.txt -Encoding ascii
          Get-Content ..\dist\SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "EggLab $($tag.TrimStart('v'))" --generate-notes
          }
          $exe = (Get-ChildItem ..\dist\EggLab-Setup-*.exe | Select-Object -First 1).FullName
          gh release upload $tag $exe "..\dist\latest.yml" "..\dist\SHA256SUMS.txt" --clobber
          gh release edit $tag --latest
